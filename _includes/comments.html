{% if site.giscus.enabled %}
<section class="comments-section wrap" aria-labelledby="comments-title">
  <div class="comments-heading">
    <h2 id="comments-title">评论</h2>
    <p>使用 GitHub 账户参与讨论。</p>
  </div>
  <div class="giscus"></div>
  <script>
    (function () {
      var script = document.createElement('script');
      script.src = 'https://giscus.app/client.js';
      script.async = true;
      script.crossOrigin = 'anonymous';
      script.setAttribute('data-repo', '{{ site.giscus.repo }}');
      script.setAttribute('data-repo-id', '{{ site.giscus.repo_id }}');
      script.setAttribute('data-category', '{{ site.giscus.category }}');
      script.setAttribute('data-category-id', '{{ site.giscus.category_id }}');
      script.setAttribute('data-mapping', 'pathname');
      script.setAttribute('data-strict', '0');
      script.setAttribute('data-reactions-enabled', '1');
      script.setAttribute('data-emit-metadata', '0');
      script.setAttribute('data-input-position', 'bottom');
      script.setAttribute('data-theme', document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');
      script.setAttribute('data-lang', 'zh-CN');
      script.setAttribute('data-loading', 'lazy');
      document.body.appendChild(script);
    })();
  </script>
</section>
{% endif %}
