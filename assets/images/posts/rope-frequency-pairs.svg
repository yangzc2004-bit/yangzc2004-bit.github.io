<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420">
  <title>RoPE 将相邻维度两两配对并以不同频率旋转</title>
  <rect width="960" height="420" fill="#fbf9f4"/>
  <text x="48" y="52" fill="#242420" font-family="monospace" font-size="22">PAIRED DIMENSIONS, MULTIPLE FREQUENCIES</text>
  <g font-family="sans-serif">
    <text x="60" y="105" fill="#68675f" font-size="17">一个 d 维 Query / Key 向量</text>
    <g stroke="#c9c2b7" fill="#f1ede5">
      <rect x="60" y="130" width="86" height="62"/><rect x="146" y="130" width="86" height="62"/><rect x="232" y="130" width="86" height="62"/><rect x="318" y="130" width="86" height="62"/><rect x="404" y="130" width="86" height="62"/><rect x="490" y="130" width="86" height="62"/>
    </g>
    <g fill="#242420" font-family="monospace" font-size="16" text-anchor="middle"><text x="103" y="169">q₀</text><text x="189" y="169">q₁</text><text x="275" y="169">q₂</text><text x="361" y="169">q₃</text><text x="447" y="169">…</text><text x="533" y="169">q_d−₁</text></g>
    <g fill="none" stroke="#b66343" stroke-width="3"><path d="M58 207 H234 V232 H58 Z"/><path d="M232 207 H406 V232 H232 Z"/><path d="M404 207 H578 V232 H404 Z"/></g>
    <text x="60" y="270" fill="#68675f" font-size="16">相邻维度两两配对，每一组都是独立的二维平面</text>
    <g text-anchor="middle">
      <circle cx="187" cy="339" r="38" fill="#f1ede5" stroke="#c9c2b7"/><path d="M187 339 V312" stroke="#242420" stroke-width="3"/><path d="M199 306 A35 35 0 0 1 215 324" fill="none" stroke="#b66343" stroke-width="3"/><text x="187" y="397" fill="#b66343" font-family="monospace" font-size="14">θ₀：转得快</text>
      <circle cx="374" cy="339" r="38" fill="#f1ede5" stroke="#c9c2b7"/><path d="M374 339 398 320" stroke="#242420" stroke-width="3"/><path d="M397 309 A35 35 0 0 1 406 323" fill="none" stroke="#b66343" stroke-width="3"/><text x="374" y="397" fill="#b66343" font-family="monospace" font-size="14">θ₁：转得慢一些</text>
      <circle cx="561" cy="339" r="38" fill="#f1ede5" stroke="#c9c2b7"/><path d="M561 339 586 332" stroke="#242420" stroke-width="3"/><text x="561" y="397" fill="#b66343" font-family="monospace" font-size="14">θ₂：更慢</text>
    </g>
    <rect x="675" y="142" width="230" height="190" fill="#f1ede5" stroke="#c9c2b7"/>
    <text x="700" y="181" fill="#b66343" font-family="monospace" font-size="13">SAME POSITION m</text>
    <text x="700" y="220" fill="#242420" font-size="18">同一位置、不同频率</text>
    <text x="700" y="252" fill="#68675f" font-size="15">共同组成多尺度坐标</text>
    <text x="700" y="292" fill="#68675f" font-family="monospace" font-size="16">(q₂ᵢ, q₂ᵢ₊₁)</text>
  </g>
</svg>
