<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8f887d"/></marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ded8cd" stroke-width=".7" opacity=".55"/></pattern>
  </defs>
  <rect width="1200" height="620" fill="#f3efe6"/>
  <rect x="30" y="30" width="1140" height="560" fill="url(#grid)" stroke="#d4cdc0"/>
  <text x="70" y="85" fill="#777168" font-family="ui-monospace,monospace" font-size="15" letter-spacing="3">03 / RESIDUAL CONNECTION</text>
  <text x="70" y="130" fill="#292824" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="600">新的理解，落在旧的表示上</text>

  <path d="M252 364H425" fill="none" stroke="#8f887d" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M615 364H795" fill="none" stroke="#8f887d" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M875 364H1010" fill="none" stroke="#8f887d" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M205 325C300 182 700 175 824 315" fill="none" stroke="#b66343" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>

  <rect x="120" y="325" width="110" height="78" fill="#f8f4ec" stroke="#8f887d" stroke-width="1.5"/>
  <text x="175" y="375" fill="#393732" font-family="ui-monospace,monospace" font-size="29" text-anchor="middle">x</text>
  <text x="175" y="438" fill="#777168" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" text-anchor="middle">原来的自己</text>

  <rect x="450" y="300" width="140" height="128" fill="#e8e8de" stroke="#89907f" stroke-width="1.5"/>
  <text x="520" y="353" fill="#535c4b" font-family="ui-monospace,monospace" font-size="22" text-anchor="middle">FFN</text>
  <text x="520" y="387" fill="#697161" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" text-anchor="middle">展开 · 激活 · 收拢</text>
  <text x="520" y="467" fill="#777168" font-family="ui-monospace,monospace" font-size="15" text-anchor="middle">FFN(x)</text>

  <circle cx="835" cy="364" r="40" fill="#f8f4ec" stroke="#b66343" stroke-width="1.7"/>
  <path d="M819 364h32M835 348v32" stroke="#b66343" stroke-width="2"/>
  <text x="835" y="438" fill="#777168" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" text-anchor="middle">相加</text>

  <rect x="1035" y="325" width="110" height="78" fill="#e2b7a2" stroke="#b66343" stroke-width="1.5"/>
  <text x="1090" y="375" fill="#774b3b" font-family="ui-monospace,monospace" font-size="27" text-anchor="middle">x′</text>
  <text x="1090" y="438" fill="#777168" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" text-anchor="middle">继续向前</text>

  <rect x="420" y="198" width="245" height="43" fill="#f3efe6"/>
  <text x="542" y="226" fill="#a45d42" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" text-anchor="middle">保留一条不经过 FFN 的路</text>
  <text x="600" y="533" fill="#393732" font-family="ui-monospace,monospace" font-size="22" text-anchor="middle">x′ = x + FFN(x)</text>
  <text x="600" y="566" fill="#8a8378" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" text-anchor="middle">不是彻底替换，而是在原来的形状里，发生一点偏移</text>
</svg>
