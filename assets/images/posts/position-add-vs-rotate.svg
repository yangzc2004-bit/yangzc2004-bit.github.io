<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420">
  <title>正弦位置编码的加法与 RoPE 的旋转对比</title>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#b66343" stroke-width="1.5"/></marker></defs>
  <rect width="960" height="420" fill="#fbf9f4"/>
  <text x="48" y="52" fill="#242420" font-family="monospace" font-size="22">ADD POSITION VS. ROTATE POSITION</text>
  <path d="M480 90 V374" stroke="#dcd9d1"/>
  <g font-family="sans-serif">
    <text x="70" y="105" fill="#b66343" font-family="monospace" font-size="14">SINUSOIDAL PE / ADD</text>
    <text x="70" y="141" fill="#242420" font-size="24">把位置加到词向量上</text>
    <rect x="70" y="188" width="140" height="62" fill="#f1ede5" stroke="#c9c2b7"/><text x="140" y="227" text-anchor="middle" fill="#242420" font-family="monospace" font-size="18">x_token</text>
    <rect x="70" y="284" width="140" height="62" fill="#f1ede5" stroke="#c9c2b7"/><text x="140" y="323" text-anchor="middle" fill="#242420" font-family="monospace" font-size="18">PE_pos</text>
    <circle cx="292" cy="267" r="28" fill="#242420"/><text x="292" y="275" text-anchor="middle" fill="#fbf9f4" font-size="26">+</text>
    <path d="M212 218 272 250 M212 315 272 284 M322 267 H378" stroke="#b66343" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="380" y="230" width="70" height="74" fill="#f1ede5" stroke="#c9c2b7"/><text x="415" y="274" text-anchor="middle" fill="#242420" font-family="monospace" font-size="18">x′</text>
    <text x="70" y="382" fill="#68675f" font-size="15">位置作为输入特征，后续网络学习如何使用</text>
    <text x="520" y="105" fill="#b66343" font-family="monospace" font-size="14">ROPE / ROTATE</text>
    <text x="520" y="141" fill="#242420" font-size="24">把位置写进 Q、K 的方向</text>
    <rect x="520" y="188" width="100" height="62" fill="#f1ede5" stroke="#c9c2b7"/><text x="570" y="227" text-anchor="middle" fill="#242420" font-family="monospace" font-size="18">q</text>
    <rect x="520" y="284" width="100" height="62" fill="#f1ede5" stroke="#c9c2b7"/><text x="570" y="323" text-anchor="middle" fill="#242420" font-family="monospace" font-size="18">k</text>
    <rect x="680" y="188" width="100" height="62" fill="#f1ede5" stroke="#c9c2b7"/><text x="730" y="227" text-anchor="middle" fill="#b66343" font-family="monospace" font-size="18">R_m q</text>
    <rect x="680" y="284" width="100" height="62" fill="#f1ede5" stroke="#c9c2b7"/><text x="730" y="323" text-anchor="middle" fill="#b66343" font-family="monospace" font-size="18">R_n k</text>
    <path d="M622 218 H675 M622 315 H675" stroke="#b66343" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M782 218 C852 218 852 315 782 315" fill="none" stroke="#68675f" stroke-width="2"/>
    <text x="838" y="273" fill="#242420" font-family="monospace" font-size="18">qₘ · kₙ</text>
    <text x="520" y="382" fill="#68675f" font-size="15">位置直接进入注意力点积，留下 n − m</text>
  </g>
</svg>
